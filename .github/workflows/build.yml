name: Build

# Builds the vsix from the latest YAMS and YAGSL docs, and publishes it to the "latest" release
# that the README's download button points at.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The docs change without this repo changing, so rebuild every day too.
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out the YAMS docs
        uses: actions/checkout@v5
        with:
          repository: Yet-Another-Software-Suite/YAMS-Gitbook
          path: docs/YAMS-Gitbook

      - name: Check out the YAGSL docs
        uses: actions/checkout@v5
        with:
          repository: Yet-Another-Software-Suite/YAGSL-gitbook
          path: docs/YAGSL-gitbook

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Number this build
        # 2027.0.<run number>, so VS Code sees each build as an update.
        run: npm version --no-git-tag-version "$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}"

      - name: Build the tutorials
        run: node scripts/build-docs.mjs --yams docs/YAMS-Gitbook --yagsl docs/YAGSL-gitbook

      - name: Package the vsix
        run: mkdir -p dist && npx vsce package --out dist/yass-tutorials.vsix

      - uses: actions/upload-artifact@v5
        with:
          name: yass-tutorials-vsix
          path: dist/yass-tutorials.vsix

      - name: Publish to the latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          notes="Built from ${GITHUB_SHA::7} with the YAMS docs at $(git -C docs/YAMS-Gitbook rev-parse --short HEAD) and the YAGSL docs at $(git -C docs/YAGSL-gitbook rev-parse --short HEAD). Install it in WPILib VS Code with Extensions, ..., Install from VSIX."
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --title "YASS Tutorials $version" --notes "$notes" --latest
          else
            gh release create latest --title "YASS Tutorials $version" --notes "$notes" --latest --target "$GITHUB_SHA"
          fi
          gh release upload latest dist/yass-tutorials.vsix --clobber
          # Keep the tag on the commit this build came from.
          git tag -f latest && git push -f origin latest
